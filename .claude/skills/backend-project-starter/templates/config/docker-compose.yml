services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

# Add a `redis` service here (see the realtime-chat-system skill's
# templates/docker-compose-snippet.yml) only if/when chat is scaffolded in —
# nothing in this starter needs Redis.

volumes:
  postgres_data:
